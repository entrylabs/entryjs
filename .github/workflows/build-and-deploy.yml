name: 'build-and-deploy'
on:
    push:
        branches:
            - 'deploy/**'
            - master
            - develop-hw
            - develop2
            - develop
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              env:
                  NODE_OPTIONS: '--max-old-space-size=4096'
                  TOOL_NODE_FLAGS: '--max-old-space-size=4096'
              with:
                  node-version: 20
                  registry-url: 'https://registry.npmjs.org'
            - uses: pnpm/action-setup@v3
              name: Install pnpm
              with:
                  version: 9
                  run_install: true
            - name: entry build
              env:
                  NODE_OPTIONS: '--max-old-space-size=4096'
                  TOOL_NODE_FLAGS: '--max-old-space-size=4096'
              run: pnpm prod
            # dev 채널: develop push 마다 새 prerelease 를 dev 태그로 배포한다.
            # 버전은 러너에서만 바꾸고 커밋하지 않으므로, publish 후 package.json 을 원복해
            # 뒤따르는 build.sh/deploy.sh 가 dist 브랜치에 담는 내용물은 기존과 동일하게 유지한다.
            - name: publish dev
              if: github.ref == 'refs/heads/develop'
              shell: bash
              run: |
                  set -euo pipefail
                  PKG=$(node -p "require('./package.json').name")
                  NEXT=$(node -p "const v = require('./package.json').version.split('-')[0].split('.').map(Number); v[2] += 1; v.join('.')")
                  # 이미 npm 에 올라간 <NEXT>-dev.N 중 가장 큰 N 에 1 을 더한다.
                  # 정식 버전이 올라가 NEXT 가 바뀌면 그 base 의 dev 가 하나도 없으므로
                  # 번호가 자동으로 1 부터 다시 시작한다. (4.0.23-dev.3 -> 4.0.24-dev.1)
                  # 발행 이력을 근거로 삼으니 재publish 가 거부될 일도 없다.
                  DEV_SEQ=$(npm view "$PKG" versions --json | NEXT="$NEXT" node -e '
                      let vs = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
                      if (!Array.isArray(vs)) vs = [vs];
                      const re = new RegExp("^" + process.env.NEXT.replace(/\./g, "\\.") + "-dev\\.(\\d+)$");
                      console.log(vs.reduce((max, v) => { const hit = re.exec(v); return hit ? Math.max(max, +hit[1]) : max; }, 0) + 1);
                  ')
                  VERSION="$NEXT-dev.$DEV_SEQ"
                  # 버전 계산이 조용히 실패한 채 publish 되는 것을 막는다.
                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || { echo "::error::계산된 버전이 올바르지 않습니다: $VERSION"; exit 1; }
                  echo "publish $PKG@$VERSION (dist-tag: dev)"
                  npm pkg set version="$VERSION"
                  npm publish --tag dev
                  git checkout -- package.json
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            # latest 채널: master push 시, package.json 버전이 npm 에 아직 없을 때만 배포된다.
            # 이미 있는 버전이면 액션이 조용히 skip 하므로 master push 마다 돌려도 안전하다.
            - name: publish latest
              if: github.ref == 'refs/heads/master'
              uses: JS-DevTools/npm-publish@v3
              with:
                  token: ${{ secrets.NPM_TOKEN }}
            - name: Define branch name
              id: target_branch
              shell: bash
              run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF##*/})"
            - uses: haya14busa/action-cond@v1
              id: deploy_branch
              with:
                  cond: ${{ steps.target_branch.outputs.branch == 'master' }}
                  if_true: 'build'
                  if_false: dist/${{ steps.target_branch.outputs.branch }}
            - name: Execute build.sh
              run: |
                  sh ./scripts/build.sh
            - name: Execute deploy.sh
              run: |
                  sh ./scripts/deploy.sh
            - name: Push Changes into build branch
              uses: ad-m/github-push-action@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  force: true
                  directory: ./build
                  branch: ${{ steps.deploy_branch.outputs.value }}
